# .github/workflows/agentfit.yml
# Runs agent-fit assessment on every pull request.
# Uploads JSON artifact for trend tracking and posts a PR summary comment.
#
# Prerequisites:
#   - Claude Code available in your CI environment
#   - ANTHROPIC_API_KEY secret configured in repository settings

name: Agent-Fit Assessment

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Agent-Fit Assessment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude -p "/agentfit" --output-format json > /tmp/agentfit-output.json || true
          PROJECT_NAME=$(basename "$GITHUB_WORKSPACE")
          GIT_SHA=$(git rev-parse --short HEAD)
          cp "/tmp/agentfit-report-${PROJECT_NAME}-${GIT_SHA}.json" agentfit-report.json || true

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentfit-report-${{ github.sha }}
          path: agentfit-report.json
          retention-days: 90

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('agentfit-report.json', 'utf8'));
              const body = [
                '## Agent-Fit Assessment',
                '',
                `**Maturity Level**: ${report.scores.maturity_level}`,
                `**Pass Rate**: ${report.scores.pass_rate}%`,
                `**Weighted Score**: ${report.scores.weighted_score}%`,
                `**Schema Version**: ${report.schema_version}`,
                '',
                `> Assessed ${report.metadata.total_criteria} criteria (${report.metadata.skipped_criteria} skipped)`,
                '',
                '_Generated by [Agent-Fit](https://github.com/HarshwardhanPatil07/agent-fit)_'
              ].join('\n');

              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (e) {
              console.log('No valid agentfit report found:', e.message);
            }
